name: DEXRIVE Windows 1.4.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dexrive-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-inspector/**/*.gradle*
      - name: Build and test Android APK and AAB
        working-directory: android-inspector
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - name: Stage Android build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-release
          cp android-inspector/app/build/outputs/apk/debug/app-debug.apk android-release/DEXRIVE-APK-Inspector-0.5.0-debug.apk
          cp android-inspector/app/build/outputs/bundle/release/app-release.aab android-release/DEXRIVE-APK-Inspector-0.5.0-unsigned.aab
          test -s android-release/DEXRIVE-APK-Inspector-0.5.0-debug.apk
          test -s android-release/DEXRIVE-APK-Inspector-0.5.0-unsigned.aab
          sha256sum android-release/*
      - uses: actions/upload-artifact@v4
        with:
          name: DEXRIVE-1.4.0-Android
          path: android-release/*
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      DEXRIVE_VERSION: 1.4.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate original DEXRIVE installer artwork and icon
        shell: pwsh
        run: |
          python .dexrive/make_windows_ico.py
          python .dexrive/make_setup_artwork.py
          foreach ($name in @('dexrive-welcome.bmp', 'dexrive-header.bmp')) {
            if (!(Test-Path (Join-Path 'packaging/windows/branding' $name))) { throw "Missing NSIS artwork: $name" }
          }
      - name: Build Windows launcher and bundled runtime
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon :dexrive-gui:copyDistWinWithJre -PbundleJRE=true
      - name: Run Java unit tests
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon :dexrive-gui:test :dexrive-core:test
      - name: Validate Windows distribution
        shell: pwsh
        run: |
          $root = "dexrive-gui/build/dexrive-gui-with-jre-win"
          if (!(Test-Path "$root/DEXRIVE.exe")) { throw "DEXRIVE.exe missing" }
          if (!(Test-Path "$root/jre/bin/javaw.exe")) { throw "Bundled Java runtime missing" }
          if (!(Get-ChildItem "$root/lib/*.jar")) { throw "GUI library missing" }
          Copy-Item LICENSE,NOTICE,BRAND_NOTICE.md,README.md $root -Force
          $exe = Join-Path (Resolve-Path $root) "DEXRIVE.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--help" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Launcher smoke test failed: $($p.ExitCode)" }
      - name: Install NSIS packaging compiler
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build portable.exe and setup.exe
        shell: pwsh
        run: |
          $root = (Resolve-Path "dexrive-gui/build/dexrive-gui-with-jre-win").Path
          $icon = (Resolve-Path "dexrive-gui/dist/windows/dexrive.ico").Path
          $branding = (Resolve-Path "packaging/windows/branding").Path
          $out = Join-Path (Get-Location) "release-output"
          New-Item -ItemType Directory -Force $out | Out-Null
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) { $compiler = (Get-Command makensis.exe -ErrorAction Stop).Source }
          & $compiler "/DAPPROOT=$root" "/DOUTDIR=$out" "/DICONROOT=$icon" "packaging/windows/dexrive-portable.nsi"
          if ($LASTEXITCODE -ne 0) { throw "Portable packaging failed" }
          & $compiler "/DAPPROOT=$root" "/DOUTDIR=$out" "/DICONROOT=$icon" "/DBRANDROOT=$branding" "packaging/windows/dexrive-setup.nsi"
          if ($LASTEXITCODE -ne 0) { throw "Setup packaging failed" }
          Get-ChildItem $out
          foreach ($file in @("DEXRIVE-1.4.0-portable.exe","DEXRIVE-1.4.0-setup.exe")) {
            $p = Join-Path $out $file
            if (!(Test-Path $p)) { throw "Missing package: $file" }
            if ((Get-Item $p).Length -lt 1000000) { throw "Incomplete package: $file" }
            $bytes = [IO.File]::ReadAllBytes($p)
            if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "Invalid Windows executable: $file" }
          }
      - name: Silent installer and portable extraction smoke tests
        shell: pwsh
        run: |
          $out = Join-Path (Get-Location) "release-output"
          $portable = Join-Path $out "DEXRIVE-1.4.0-portable.exe"
          $portableProcess = Start-Process -FilePath $portable -ArgumentList "/S" -Wait -PassThru
          if ($portableProcess.ExitCode -ne 0) { throw "Portable extraction failed: $($portableProcess.ExitCode)" }
          if (!(Test-Path (Join-Path $out "DEXRIVE-Portable/DEXRIVE.exe"))) { throw "Portable launcher missing" }
          $setup = Join-Path $out "DEXRIVE-1.4.0-setup.exe"
          $setupProcess = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) { throw "Silent installer failed: $($setupProcess.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs/DEXRIVE/DEXRIVE.exe"
          if (!(Test-Path $installed)) { throw "Installed EXE missing" }
          if (!(Test-Path (Join-Path $env:LOCALAPPDATA "Programs/DEXRIVE/LICENSE"))) { throw "License missing from setup" }
          if (!(Test-Path (Join-Path $env:LOCALAPPDATA "Programs/DEXRIVE/NOTICE"))) { throw "Required NOTICE missing from setup" }
          if (!(Test-Path (Join-Path $env:LOCALAPPDATA "Programs/DEXRIVE/BRAND_NOTICE.md"))) { throw "Brendigo notice missing from setup" }
          $uninstall = Join-Path $env:LOCALAPPDATA "Programs/DEXRIVE/Uninstall.exe"
          if (Test-Path $uninstall) { Start-Process -FilePath $uninstall -ArgumentList "/S" -Wait | Out-Null }
      - name: Publish Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DEXRIVE-1.4.0-Windows
          path: release-output/DEXRIVE-1.4.0-*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DEXRIVE-1.4.0-*
          path: publish-assets
          merge-multiple: true
      - name: Validate four release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          for name in DEXRIVE-1.4.0-setup.exe DEXRIVE-1.4.0-portable.exe DEXRIVE-APK-Inspector-0.5.0-debug.apk DEXRIVE-APK-Inspector-0.5.0-unsigned.aab; do
            test -s "publish-assets/$name"
          done
          test "$(find publish-assets -maxdepth 1 -type f | wc -l)" -eq 4
          (cd publish-assets && sha256sum * > SHA256SUMS.txt)
      - name: Publish immutable DEXRIVE 1.4.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::v1.4.0 already exists; refusing to overwrite published assets."
            exit 0
          fi
          gh release create v1.4.0 publish-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DEXRIVE 1.4.0 by Brendigo" \
            --notes-file docs/RELEASE_1.4.0.md
